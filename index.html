
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Barcode Test Wrapper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    header {
      padding: 14px;
      background: #1769aa;
      color: white;
      text-align: center;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 55px);
      border: 0;
    }
  </style>
</head>

<body>

  <header>
    Camera Barcode Test
  </header>

  <iframe
    src="https://script.google.com/a/macros/astronauts.id/s/AKfycbyLpRhw-7cjnN5eBX1ikgteEfsDIpTnsW4qnl5Si7v9XgpMntxGE0cAxntqlYFJLTtUbQ/exec"
    allow="camera; autoplay"
    allowfullscreen>
  </iframe>

</body>
</html>
